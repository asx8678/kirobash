# kiro-guard settings. The agent cannot edit this file (the guard and
# permissions.yaml block writes to ~/.kiro/hooks). Edit it yourself.
# A value that is not one of those listed counts as the strictest one (kiro-doctor reports it), and
# KIRO_<NAME> in the environment of the person launching Kiro can only make a setting stricter.

# destructive : block destructive commands (delete, destroy, apply, uninstall, purge, ...)
#               mutating commands (apply, scale, create, az ... update) are allowed here and
#               go through Kiro's permission prompt instead.
# readonly    : also block mutating commands against clusters/Azure (local dev clusters excepted)
# off         : disable the guard
GUARD_MODE=destructive

# enforce : programs go through kiro-run, which saves, caps, logs, redacts and credential-checks them:
#           inline code (python3 -c, bash -c, heredocs/here-strings/stdin into interpreters) and any
#           shell line with more than one command (;, &&, loops) are redirected. Script files
#           (python3 x.py, bash x.sh), modules (python3 -m) and single commands are unaffected, and so are
#           multi-command lines that really run kubectl/helm/az/aws against a cluster or account
#           while no read-only credentials are active (kiro-run would refuse them).
# inline  : only inline code is redirected; multi-command shell lines run directly
# prefer  : steering asks for kiro-run but nothing is redirected
# off     : no code-mode handling
# Whatever the mode, a kiro-run program may not contain steps that need approval (push, apply, install,
# ssh ...) or touch Kiro's own files. Secrets do not stop a program: kiro-run masks their values in the output.
CODE_MODE=enforce

# mask : a read that would put a secret value into the conversation is sent through kiro-run, which
#        masks it: the read tool on a file that holds one (or on a secrets file), the search tool when a
#        match or its context holds one, and a direct cat/head/grep/jq of such a file. The agent is told
#        the program to run instead (kt.read, kt.grep, or the same command). Other reads are untouched.
# off  : reads are not checked (secret values in files can reach the model)
SECRET_READS=mask

# kiro-run: programs that really run a cluster or cloud command (kubectl, az, aws, boto3 ...) are refused
# unless read-only credentials for that cloud are active. 1 lets them run with whatever credentials are
# active (admin included). The environment cannot set this.
RUN_ALLOW_ADMIN=0

# kiro-run: run programs in an OS sandbox (Linux, bubblewrap from /usr/bin or /bin): the project and
# its .kiro/scratch are writable; .git, .kiro, $HOME and the system are read-only; credential folders
# (~/.ssh, ~/.aws, ~/.azure, ~/.kube ...) are empty.
# off     : no sandbox (programs run as you, with your files and network)
# auto    : sandbox when bubblewrap works here, otherwise run without and say so
# require : refuse to run a program when the sandbox cannot be started
RUN_SANDBOX=off
# deny  : no network inside the sandbox (also no local sockets such as docker.sock or ssh-agent), except
#         for a program whose cloud commands run with read-only credentials
# allow : network as usual inside the sandbox
RUN_SANDBOX_NET=deny

# Kubernetes contexts treated as local/disposable (regex, full match). Destructive kubectl/helm
# commands are allowed on these. Remove entries to be stricter.
LOCAL_CONTEXTS=kind-.*|minikube|docker-desktop|docker-for-desktop|rancher-desktop|orbstack|k3d-.*|colima.*|microk8s

# Audit log: every command the guard classified as mutating or destructive, allowed or blocked
LOG_FILE=~/.kiro/kiro-guard.log
